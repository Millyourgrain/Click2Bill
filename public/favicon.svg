<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Background circle -->
  <circle cx="24" cy="24" r="24" fill="#142a42"/>
  <!-- Invoice shape -->
  <rect x="13" y="10" width="18" height="24" rx="2" fill="#faf6ef" opacity="0.12"/>
  <rect x="13" y="10" width="18" height="24" rx="2" stroke="#c6a14a" stroke-width="1.5"/>
  <!-- Lines representing invoice rows -->
  <line x1="17" y1="17" x2="27" y2="17" stroke="#c6a14a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="21" x2="27" y2="21" stroke="#faf6ef" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="17" y1="25" x2="23" y2="25" stroke="#faf6ef" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- "2" accent badge -->
  <circle cx="33" cy="14" r="7" fill="#c6a14a"/>
  <text x="33" y="18" text-anchor="middle" font-family="'DM Sans',sans-serif" font-size="9" font-weight="700" fill="#142a42">2</text>
</svg>
